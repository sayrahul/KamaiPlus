<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Pay via UPI</title>
<style>
  :root {
    --ink: #0F172A;
    --ink-muted: #64748B;
    --accent: #059669;
    --accent-dark: #047857;
    --border: #E2E8F0;
    --bg: #F8FAFC;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    padding: 24px;
  }
  .card {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 32px 28px;
    max-width: 380px;
    width: 100%;
    text-align: center;
    box-shadow: 0 4px 20px rgba(15, 23, 42, 0.06);
  }
  .icon {
    width: 56px;
    height: 56px;
    border-radius: 16px;
    background: #ECFDF5;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 16px;
    font-size: 28px;
  }
  h1 {
    font-size: 15px;
    font-weight: 700;
    margin: 0 0 4px;
    color: var(--ink-muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .store-name {
    font-size: 20px;
    font-weight: 800;
    margin: 0 0 16px;
  }
  .amount {
    font-size: 34px;
    font-weight: 800;
    color: var(--ink);
    margin: 0 0 24px;
    font-variant-numeric: tabular-nums;
  }
  .amount .rupee { color: var(--ink-muted); font-size: 22px; }
  button.pay-btn {
    width: 100%;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 14px;
    padding: 16px;
    font-size: 16px;
    font-weight: 800;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  button.pay-btn:active { background: var(--accent-dark); }
  .hint {
    font-size: 12.5px;
    color: var(--ink-muted);
    margin-top: 14px;
    line-height: 1.5;
  }
  .error {
    color: #DC2626;
    font-size: 13px;
    margin-top: 12px;
  }
  .brand {
    margin-top: 22px;
    font-size: 11px;
    color: #94A3B8;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">💸</div>
    <h1>Pay via UPI</h1>
    <div class="store-name" id="storeName">Loading…</div>
    <div class="amount" id="amount"></div>
    <button class="pay-btn" id="payBtn" onclick="openUpi()">
      Open UPI App to Pay
    </button>
    <div class="hint">Opens your Google Pay, PhonePe, Paytm or any UPI app to complete the payment.</div>
    <div class="error" id="errorMsg" style="display:none"></div>
    <div class="brand">Powered by KamaiPlus</div>
  </div>

<script>
  // This page exists for exactly one reason: a raw `upi://pay?...` link
  // embedded in WhatsApp message text sits inert — WhatsApp only
  // auto-links http(s):// text as tappable. This is a first-party,
  // self-hosted redirector (no third-party service sees the payment
  // details — the URL param is the same UPI intent data that was always
  // going out in the raw upi:// link anyway) that WhatsApp WILL render as
  // a clickable link, which then hands off to whichever UPI app is
  // installed. See lib/core/utils/upi_link_utils.dart in the main
  // KamaiPlus POS app for how this URL is constructed.
  function getParam(name) {
    return new URLSearchParams(window.location.search).get(name);
  }

  const upiUri = getParam('u');
  const storeName = getParam('s') || 'the store';
  const amount = getParam('a');

  document.getElementById('storeName').textContent = storeName;
  if (amount) {
    document.getElementById('amount').innerHTML = '<span class="rupee">₹</span>' + amount;
  } else {
    document.getElementById('amount').style.display = 'none';
  }

  function openUpi() {
    if (!upiUri) return;
    window.location.href = upiUri;
  }

  if (!upiUri) {
    document.getElementById('payBtn').disabled = true;
    document.getElementById('payBtn').style.opacity = '0.5';
    const err = document.getElementById('errorMsg');
    err.style.display = 'block';
    err.textContent = 'This payment link is missing its details. Please ask the store to resend it.';
  } else {
    // Best-effort automatic redirect — many mobile browsers only allow a
    // custom-scheme navigation (upi://) from a genuine user tap, not an
    // automatic page-load redirect, so the button above is the reliable
    // path; this just saves a tap where the browser does permit it.
    setTimeout(openUpi, 400);
  }
</script>
</body>
</html>
