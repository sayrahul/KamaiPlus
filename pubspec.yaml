    sdk: flutter

  cupertino_icons: ^1.0.8
  intl: ^0.20.3
  uuid: ^4.6.0
  shared_preferences: ^2.5.5
  sqflite: ^2.4.3
  path: ^1.9.1
  google_fonts: ^8.2.1
