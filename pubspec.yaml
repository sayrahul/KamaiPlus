name: kamaiplus_pos
description: "KamaiPlus Native Android POS App"
publish_to: 'none'

version: 4.22.0+42202

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  intl: ^0.20.3
  uuid: ^4.6.0
  shared_preferences: ^2.5.5
  sqflite: ^2.4.3
  path: ^1.9.1
  google_fonts: ^8.2.1
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.2
  crypto: ^3.0.7
  # Pure-Dart AES-GCM + PBKDF2 for optional password-protected .kmb backups
  # (see backup_restore_service.dart). No native code, so no platform build risk.
  pointycastle: ^3.9.1
  # Reads .xlsx on-device so a distributor's Excel file imports offline, with
  # no API and no conversion step (see csv_inward_service.dart).
  excel: ^4.0.6
  # Reads the REAL installed versionCode at runtime. It used to be a
  # hardcoded constant in home_dashboard_screen.dart that had to be
  # hand-edited every release, or the force-update gate compared the wrong
  # number and silently misfired.
  package_info_plus: ^10.2.1
  mobile_scanner: ^7.4.0
  firebase_core: ^4.14.0
  cloud_firestore: ^6.9.0
  firebase_auth: ^6.6.1
  google_sign_in: ^7.2.0
  firebase_messaging: ^16.6.0
  flutter_local_notifications: ^22.3.0
  image_picker: ^1.2.3
  razorpay_flutter: ^1.4.6
  file_picker: ^12.2.0
  local_auth: ^3.0.2
  google_mlkit_text_recognition: ^0.17.1
  home_widget: ^0.9.4
  workmanager: ^0.10.10
  in_app_update: ^5.0.0
  share_plus: ^13.3.0
  path_provider: ^2.1.6
  pdf: ^3.11.3
  printing: ^5.13.4
  firebase_remote_config: ^6.7.0
  firebase_crashlytics: ^5.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.4+4

flutter:
  uses-material-design: true

  assets:
    - assets/images/

dependency_overrides:
  path_provider_android: 2.2.15
